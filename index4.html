<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NineMemos V4</title><style>*{box-sizing:border-box}body{margin:0;background:#0d1424;color:#f5f2fa;font:14px/1.6 system-ui,sans-serif}button,input,select{font:inherit}button{background:#2b3852;color:white;border:1px solid #52617b;border-radius:10px;padding:10px;cursor:pointer}button:hover{border-color:#f6a5c9}.primary{background:linear-gradient(110deg,#e67eae,#8c73e8);border:0;font-weight:bold}input,select{background:#101b30;border:1px solid #52617b;color:white;padding:10px;border-radius:10px}main{padding:24px;min-width:0}.layout{display:grid;grid-template-columns:180px minmax(0,1fr) 230px;max-width:1450px;margin:auto;min-height:100vh}aside{padding:17px;background:#151e31;border-right:1px solid #33445d}.right{border-right:0;border-left:1px solid #33445d}.logo{font-size:23px;font-weight:900}.logo b{color:#f19ec8}nav{display:grid;gap:7px;margin:22px 0}nav button{text-align:left}.panel{background:#1c2940;border:1px solid #40516c;border-radius:15px;padding:17px;margin:12px 0}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.choice{cursor:pointer}.choice:hover{border-color:#f19ec8}.avatar{font-size:70px;text-align:center;padding:22px;background:radial-gradient(#aa729e,#393457);border-radius:12px}.muted{color:#aebdd5}.tag{font-size:11px;color:#ffabd0;letter-spacing:2px;font-weight:bold}h1{font-size:26px}h2{font-size:19px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.chat{height:390px;overflow:auto;background:#10192b;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}.bubble{padding:11px;border-radius:13px;max-width:85%;white-space:pre-wrap}.ai{background:#303d56;align-self:flex-start}.me{background:#72558b;align-self:flex-end}.pill{border-radius:30px;padding:4px 9px;background:#433451;color:#ffd4e9}.hero{background:linear-gradient(100deg,#372b4c,#1c3048);padding:20px;border-radius:17px}.hero .avatar{float:left;margin-right:20px;padding:5px;background:none}.note{font-size:12px;color:#bdc8da}@media(max-width:980px){.layout{grid-template-columns:160px 1fr}.right{grid-column:1/-1}}@media(max-width:650px){.layout{display:block}aside{padding:10px}nav{display:flex;overflow:auto}nav button{white-space:nowrap}main{padding:13px}}</style><div class="layout"><aside><div class="logo">Nine<b>Memos</b></div><div class="tag">AI CHARACTER V4</div><nav id="nav"></nav><div class="panel"><b id="scenarioName">시나리오 미선택</b><p id="characterName" class="muted"></p><button onclick="restart()">시나리오 변경</button></div></aside><main id="main"></main><aside class="right"><div class="panel"><div class="tag">RELATIONSHIP</div><h3 id="relation">관계 기억</h3><div id="rapport">친밀도 20</div><p class="muted" id="memoryPreview">아직 기억이 없습니다.</p></div><div class="panel"><div class="tag">CREDITS</div><h1 id="balance">1,000</h1><button onclick="topup()">+500 데모 충전</button><div id="ledger" class="note"></div></div><div class="panel note">금융정보·미디어는 시연 데이터입니다. 실제 API 및 생성 모델은 연결되지 않았습니다.</div></aside></div><script>
const worlds=[{id:'executive',name:'회사의 임원과 비서',role:'임원 ↔ 전담 비서',icon:'🏙️',people:[['서아','👩🏻‍💼','차분하고 다정한 비서'],['리아','👩🏽‍💼','매력적이고 장난스러운 비서'],['유나','👩🏻','지적이고 도도한 비서']]},{id:'professor',name:'경제학과 교수와 학생',role:'교수 ↔ 성인 대학생',icon:'🎓',people:[['지민','👩🏻‍🎓','호기심 많은 25세 대학원생'],['하린','👩🏽‍🎓','유쾌한 24세 학생'],['민서','👩🏻‍💻','열정적인 26세 학생']]},{id:'finance',name:'금융사의 과장과 신입사원',role:'과장 ↔ 신입사원',icon:'💹',people:[['나연','👩🏻‍💼','활발한 신입사원'],['유진','👩🏽‍💼','꼼꼼한 신입사원'],['소희','👩🏻‍💻','재치 있는 신입사원']]}];
const stocks=[['NVDA','NVIDIA','미국','AI 반도체·GPU','엔비디아의 AI 연산용 대표 제품은?',['GPU','원유','항공기']],['MSFT','Microsoft','미국','Azure 클라우드','마이크로소프트의 클라우드 브랜드는?',['Azure','CUDA','AWS']],['TSLA','Tesla','미국','전기차·에너지','테슬라가 전기차 외에 하는 사업은?',['에너지 저장','제약','해운']],['005930','삼성전자','한국','메모리 반도체','삼성전자의 메모리 반도체 제품은?',['DRAM','원유','철광석']],['000660','SK하이닉스','한국','HBM 메모리','HBM의 뜻은?',['High Bandwidth Memory','High Bank Market','Hybrid Battery Module']]];
let s=JSON.parse(localStorage.getItem('nm_v4_demo')||'null')||{world:null,person:null,tickers:['NVDA','005930'],messages:[],memory:[],rapport:20,credits:1000,ledger:[]},page=s.person?'home':'setup',step=s.world?1:0,quizStock='NVDA';const $=id=>document.getElementById(id),w=()=>worlds.find(x=>x.id===s.world),person=()=>w()?.people.find(x=>x[0]===s.person),safe=t=>String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));function persist(){localStorage.setItem('nm_v4_demo',JSON.stringify(s));side()}function side(){$('scenarioName').textContent=w()?.name||'시나리오 미선택';$('characterName').textContent=s.person||'캐릭터 미선택';$('relation').textContent=s.person||'관계 기억';$('rapport').textContent='친밀도 '+s.rapport+'/100';$('memoryPreview').textContent=s.memory.slice(-2).join(' · ')||'아직 기억이 없습니다.';$('balance').textContent=s.credits.toLocaleString();$('ledger').innerHTML=s.ledger.slice(-3).map(x=>'<p>'+safe(x)+'</p>').join('')}function render(){side();$('nav').innerHTML=[['home','홈'],['chat','대화'],['stocks','관심기업·공시'],['quiz','퀴즈·보상'],['studio','요청 스튜디오'],['memory','관계·기억']].map(([k,n])=>`<button onclick="go('${k}')" style="${page===k?'background:#4b3c69':''}">${n}</button>`).join('');({setup,home,chat,stockPage,quiz,studio,memory})[page==='stocks'?'stockPage':page]()}function go(x){page=s.person?x:'setup';render()}function restart(){if(!confirm('기존 캐릭터의 대화와 기억을 초기화할까요?'))return;s.world=null;s.person=null;s.messages=[];s.memory=[];s.rapport=20;step=0;page='setup';persist();render()}function setup(){if(!step)$('main').innerHTML='<div class="tag">ONBOARDING · STEP 1</div><h1>기본 시나리오를 선택하세요</h1><p class="muted">경제는 대화의 소재입니다. 관계와 이야기가 중심입니다.</p><div class="cards">'+worlds.map(x=>`<div class="panel choice" onclick="chooseWorld('${x.id}')"><div class="avatar">${x.icon}</div><h2>${x.name}</h2><p>${x.role}</p><button class="primary">이 세계관 선택</button></div>`).join('')+'</div>';else $('main').innerHTML=`<div class="tag">ONBOARDING · STEP 2</div><h1>${w().name} — 캐릭터 선택</h1><div class="cards">`+w().people.map(x=>`<div class="panel choice" onclick="choosePerson('${x[0]}')"><div class="avatar">${x[1]}</div><h2>${x[0]}</h2><p>${x[2]}</p><button class="primary">선택하고 시작</button></div>`).join('')+'</div><button onclick="step=0;render()">이전</button>'}function chooseWorld(id){s.world=id;step=1;persist();render()}function choosePerson(name){s.person=name;s.messages=[{who:'ai',text:`안녕하세요, 저는 ${name}예요. ${w().role}라는 우리의 이야기를 함께 시작해요. 관심기업 이야기도 좋고 오늘 하루 이야기부터 시작해도 좋아요.`}];s.memory=['첫 만남: '+w().name];page='home';persist();render()}
function home(){$('main').innerHTML=`<div class="tag">YOUR STORY</div><h1>${s.person}와 함께하는 하루</h1><div class="hero"><div class="avatar">${person()[1]}</div><h2>${w().name}</h2><p>${person()[2]} · ${w().role}</p><p>“오늘은 무슨 이야기를 나눠볼까요? 시장 이야기든, 일상 이야기든 좋아요.”</p><button class="primary" onclick="go('chat')">대화 시작</button> <button onclick="go('stocks')">관심기업 이야기</button></div><h2>오늘의 이야기 소재</h2><div class="cards">${s.tickers.map(t=>{let x=stocks.find(a=>a[0]===t);return x?`<div class="panel"><span class="pill">${x[2]} · ${x[0]}</span><h3>${x[1]}</h3><p>${x[3]}</p><button onclick="talk('${x[0]}')">${s.person}와 이야기하기</button></div>`:''}).join('')}</div><p class="note">※ 위 카드는 실시간 공시가 아닌 데모용 기업 소개입니다.</p>`}function talk(t){let x=stocks.find(a=>a[0]===t);s.messages.push({who:'ai',text:`${x[1]}의 ${x[3]} 이야기를 해볼까요? 최신 공시 수치는 아직 연동되지 않았지만, 어떤 점이 궁금하신지 들려주세요.`});persist();go('chat')}
function chat(){$('main').innerHTML=`<div class="tag">${w().role}</div><h1>${s.person}와 대화</h1><p class="muted">시나리오의 역할은 유지하면서 대화 주제는 자유롭게 전개합니다.</p><div class="panel"><div class="chat" id="chatlog">${s.messages.map(m=>`<div class="bubble ${m.who==='ai'?'ai':'me'}">${safe(m.text)}</div>`).join('')}</div><div class="row" style="margin-top:12px"><input id="msg" style="flex:1;min-width:160px" placeholder="자유롭게 대화하기" onkeydown="if(event.key==='Enter')send()"><button class="primary" onclick="send()">전송</button></div></div><div class="row"><button onclick="quick('오늘 좀 피곤해')">일상 대화</button><button onclick="quick('관심기업 공시가 궁금해')">공시 이야기</button><button onclick="quick('퀴즈 내줘')">퀴즈</button></div><p class="note">데모는 규칙 기반 응답입니다. 실제 서비스는 LLM + 장기 기억 + 금융 RAG 연동이 필요합니다.</p>`;$('chatlog').scrollTop=$('chatlog').scrollHeight}function quick(t){$('msg').value=t;send()}function send(){let t=$('msg').value.trim();if(!t)return;s.messages.push({who:'me',text:t});let a=/퀴즈/.test(t)?'좋아요! 퀴즈 메뉴에서 관심기업 문제를 풀어보세요. 정답을 맞히면 특별한 보상이 기다려요.':/피곤|힘들|쉬고/.test(t)?'오늘은 조금 쉬어도 괜찮아요. 일 이야기 말고 편하게 대화해요. 어떤 하루였나요?':/공시|실적|주식|기업/.test(t)?'좋아요. 관심기업의 실제 공시가 연결되면 근거를 확인해 함께 이야기할게요. 지금은 데모라 최신 숫자를 지어내지는 않을게요.':w().id==='professor'?'교수님, 그 말씀 흥미로워요. 제 생각도 나눠도 될까요?':w().id==='finance'?'과장님, 저도 배우고 싶어요. 조금 더 이야기해 주실래요?':'말씀 잘 들었어요. 오늘은 어떤 이야기를 더 나눠볼까요?';s.messages.push({who:'ai',text:a});s.rapport=Math.min(100,s.rapport+2);s.memory.push('대화: '+t.slice(0,42));s.memory=s.memory.slice(-15);s.messages=s.messages.slice(-80);persist();chat()}
function stockPage(){$('main').innerHTML=`<div class="tag">FINANCE AS A STORY TOPIC</div><h1>관심기업·공시 이야기</h1><div class="panel"><h3>관심기업 ${s.tickers.length}/5 (데모 Plus)</h3><div class="row"><select id="addTicker" style="flex:1">${stocks.filter(x=>!s.tickers.includes(x[0])).map(x=>`<option value="${x[0]}">${x[1]} (${x[0]})</option>`).join('')}</select><button onclick="addTicker()">추가</button></div></div>${s.tickers.map(t=>{let x=stocks.find(a=>a[0]===t);return `<div class="panel"><div class="row"><h3>${x[1]} (${x[0]})</h3><span class="pill">${x[2]}</span></div><p>${x[3]}</p><p class="muted">“${s.person}가 이 기업의 실제 공시가 발표되면 짧게 설명하고 자연스럽게 대화를 이어갑니다.”</p><button class="primary" onclick="talk('${t}')">대화 소재로 사용</button> <button onclick="removeTicker('${t}')">관심기업 삭제</button></div>`}).join('')}<div class="panel note">실제 구현: NineMemos 신규 API 및 삼성 AI SEC → 공시 이벤트 → 출처/시각 검증 → 캐릭터 대화. 이 페이지에는 실제 최신 공시가 표시되지 않습니다.</div>`}function addTicker(){let t=$('addTicker').value;if(!t)return;if(s.tickers.length>=5)return alert('데모 Plus는 관심기업 5개까지 가능합니다.');s.tickers.push(t);persist();stockPage()}function removeTicker(t){s.tickers=s.tickers.filter(x=>x!==t);persist();stockPage()}
function quiz(){$('main').innerHTML=`<div class="tag">QUIZ & REWARDS</div><h1>${s.person}의 깜짝 퀴즈</h1><p>기업 이야기를 재미있게 배우고, 정답을 맞히면 특별한 보상을 받으세요.</p><div class="panel"><select id="quizTicker" onchange="quizStock=this.value;quiz()">${s.tickers.map(t=>`<option value="${t}" ${quizStock===t?'selected':''}>${stocks.find(x=>x[0]===t)[1]}</option>`).join('')}</select><h2>${(stocks.find(x=>x[0]===quizStock)||stocks[0])[4]}</h2><div class="cards">${(stocks.find(x=>x[0]===quizStock)||stocks[0])[5].map((o,i)=>`<button onclick="answer(${i})">${o}</button>`).join('')}</div><div id="answerResult"></div></div><p class="note">현재 문제는 기업 기본정보 기반 데모입니다. 상용화 시 공시/실적 Fact Store에서 문제와 정답 근거를 자동 생성합니다.</p>`}function answer(i){if(i===0){s.rapport=Math.min(100,s.rapport+4);persist();$('answerResult').innerHTML=`<div class="panel"><h2>🎉 정답! ${s.person}의 특별한 축하</h2><div class="avatar">${person()[1]} 💗</div><p>“역시 대단하세요! 제가 특별히 준비한 축하 메시지와 댄스 클립을 보여드릴게요.”</p><button onclick="go('studio')">보상 스튜디오 보기</button></div>`}else $('answerResult').innerHTML='<p>아쉽지만 정답은 첫 번째예요. 다시 도전해 보세요!</p>'}
function studio(){$('main').innerHTML=`<div class="tag">REQUEST STUDIO</div><h1>${s.person}의 특별한 콘텐츠</h1><p class="muted">로맨틱한 음성, 매력적인 화보, 시네마틱 댄스 등 캐릭터와 세계관을 유지하는 요청</p><div class="cards">${[['voice','🎙️','프라이빗 보이스',10,'다정한 축하와 부드러운 메시지'],['image','📸','글래머 화보',30,'고급스러운 이브닝 패션 화보'],['video','🎬','댄스 영상',150,'프라이빗 라운지 댄스 클립']].map(x=>`<div class="panel"><div class="avatar">${x[1]}</div><h3>${x[2]}</h3><p>${x[4]}</p><b>${x[3]} 크레딧</b><p><button class="primary" onclick="order('${x[0]}',${x[3]})">요청하기</button></p></div>`).join('')}</div><div id="preview"></div><p class="note">고정 콘텐츠 및 브라우저 TTS를 활용하는 시연입니다. 실제 음성/이미지/영상 생성 API는 연결되지 않았습니다.</p>`}function order(kind,cost){if(s.credits<cost)return alert('크레딧이 부족합니다.');if(!confirm(cost+' 크레딧을 사용하여 데모를 재생할까요?'))return;s.credits-=cost;s.ledger.push(kind+' -'+cost);persist();let content=kind==='voice'?`<div class="avatar">${person()[1]}</div><p>“오늘도 정말 멋지셨어요. 제가 응원하고 있다는 것, 잊지 마세요.”</p><button onclick="speak()">▶ 음성 듣기 (브라우저 TTS)</button>`:kind==='image'?`<div class="avatar">${person()[1]} ✨</div><p>시네마틱 화보 콘셉트 이미지 시연입니다. 실제 이미지 생성 결과가 아닙니다.</p>`:`<div class="avatar" style="animation:move 1.4s infinite alternate">${person()[1]} 💃</div><p>캐릭터 댄스 모션 콘셉트 시연입니다. 실제 생성된 동영상이 아닙니다.</p>`;$('preview').innerHTML='<div class="panel"><h2>요청 결과 미리보기</h2>'+content+'</div>'}function speak(){let u=new SpeechSynthesisUtterance('오늘도 정말 멋지셨어요. 제가 응원하고 있다는 것, 잊지 마세요.');u.lang='ko-KR';u.rate=.88;u.pitch=1.1;speechSynthesis.speak(u)}function topup(){s.credits+=500;s.ledger.push('데모 충전 +500');persist()}function memory(){$('main').innerHTML=`<div class="tag">LONG-TERM MEMORY</div><h1>${s.person}와 쌓은 기억</h1><p class="muted">대화 주제와 관계 상태가 브라우저에 저장되어 새로고침 후에도 유지됩니다.</p><div class="panel"><h3>현재 세계관</h3><p>${w().role}</p><h3>친밀도 ${s.rapport}/100</h3><h3>기억 목록</h3>${s.memory.map(x=>'<p>• '+safe(x)+'</p>').join('')}<button onclick="if(confirm('기억을 삭제할까요?')){s.memory=[];persist();memory()}">기억 삭제</button></div><p class="note">상용화 시 동의·편집·삭제·보존기간 정책과 서버 기반 장기기억 저장소가 필요합니다.</p>`}render();
</script><style>@keyframes move{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}</style></html>
